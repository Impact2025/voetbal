name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: 22

jobs:
  # ─── player-hub (hoofd-app, repo-root) ───────────────────────────────────
  player-hub:
    name: player-hub (lint + typecheck + test)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      # Node 22's bundled npm (10.x) resolves vitest 4's nested vite/esbuild
      # optional peer deps differently than the npm (11.13.0) that generated
      # package-lock.json, so `npm ci` rejects the lock as out of sync even
      # though it isn't. Pin npm to match until the runner ships npm 11+.
      - run: npm install -g npm@11.13.0

      - run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm run test -- --run

  # ─── website ─────────────────────────────────────────────────────────────
  website:
    name: website (build check)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: website/package-lock.json

      - run: npm ci

      - name: Build
        run: npm run build
